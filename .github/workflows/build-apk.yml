name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Verifying Java Environment ==="
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "::error::JAVA_HOME is not set!"
            exit 1
          fi

          RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected raw Java version string: $RAW_VERSION"
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Could not detect Java version from 'java -version'."
            exit 1
          fi

          MAJOR_VERSION=$(echo "$RAW_VERSION" | awk -F. '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $MAJOR_VERSION"
          if [ -z "$MAJOR_VERSION" ]; then
            echo "::error::Failed to parse Java major version."
            exit 1
          fi

          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Active Java major version is $MAJOR_VERSION, but 17 or newer is required."
            exit 1
          fi
          echo "Java verification passed: version $MAJOR_VERSION is >= 17."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking Temporary Debug Keystore ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create or find ./debug.keystore."
            exit 1
          fi
          echo "Debug keystore is present and verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          echo "=== Verifying Built APK ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected APK not found at: $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::APK file $EXPECTED_APK is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "::error::$EXPECTED_APK does not have .apk extension."
              exit 1
              ;;
          esac

          echo "APK successfully verified at: $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK" 2>/dev/null || stat -f%z "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing APK Release Asset ==="
          ORIGINAL_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEMP_DIR="${RUNNER_TEMP}/release_asset"
          mkdir -p "$TEMP_DIR"

          REPO_NAME=$(basename "${{ github.repository }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-zA-Z0-9._-]/-/g')
          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${TEMP_DIR}/${ASSET_NAME}"

          cp "$ORIGINAL_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Failed to prepare release asset at $ASSET_PATH"
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET_PATH ($ASSET_NAME)"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing to GitHub Releases ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Asset file does not exist or is empty: $ASSET_PATH"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          cat << 'EOF' > release_notes.md
          ### Automated Debug APK Build

          This is an automatically generated debug APK build created by GitHub Actions.

          - **Build Run Number**: ${{ github.run_number }}
          - **Build Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit SHA**: ${{ github.sha }}
          - **Target Branch**: ${{ github.ref_name }}

          > **Notice**: This APK is intended for testing and debugging only. It is not a Google Play Store production release and is signed only with a temporary debug keystore.
          EOF

          gh release create "$RELEASE_TAG" \
            "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --latest

          rm -f release_notes.md
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Reporting Build and Release Result ==="
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release published successfully!"
            gh release view "$RELEASE_TAG" || true

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## :white_check_mark: Debug APK Built and Published Successfully!

          The debug APK has been published to GitHub Releases and is ready for download:

          - **Release Page**: [$RELEASE_TITLE]($RELEASE_URL)
          - **Release Tag**: \`$RELEASE_TAG\`
          - **Direct APK Asset**: \`$ASSET_NAME\` (available under the **Assets** section of the release)
          - **Backup Artifact**: The standard GitHub Actions artifact named \`app-debug-apk\` is also available on this workflow run summary page.
          EOF
          else
            echo "::warning::GitHub Release publishing did not succeed (outcome: $RELEASE_OUTCOME). However, APK compilation and artifact upload succeeded!"

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## :warning: Debug APK Compilation Succeeded

          - **APK Build**: Successfully built \`app/build/outputs/apk/debug/app-debug.apk\`.
          - **Actions Artifact**: The verified debug APK is safely stored and available for download under the workflow run artifacts: **\`app-debug-apk\`**.
          - **Release Publishing**: GitHub Release creation did not complete ($RELEASE_OUTCOME). Please ensure workflow permissions allow writing releases, or download the APK directly from the **\`app-debug-apk\`** artifact above.
          EOF
          fi
